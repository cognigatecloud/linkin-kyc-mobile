workflows:
  linkin-kyc-android:
    name: Linkin KYC Mobile Android
    max_build_duration: 120
    instance_type: linux_x2

    environment:
      vars:
        NODE_VERSION: "22"
        RN_VERSION: "0.88.1"
        RN_CLI_VERSION: "20.2.0"
        ANDROID_PACKAGE_NAME: "com.cognigate.linkinkyc"

    scripts:
      - name: Set up Node and Java
        script: |
          set -euo pipefail
          node --version
          npm --version
          java -version
          echo "Android SDK: $ANDROID_SDK_ROOT"

      - name: Install Android SDK components
        script: |
          set -euo pipefail
          yes | sdkmanager --licenses
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0" "ndk;27.1.12297006"

      - name: Generate React Native Android project
        script: |
          set -euo pipefail
          npx --yes @react-native-community/cli@${RN_CLI_VERSION} init LinkinKYC \
            --version ${RN_VERSION} \
            --package-name ${ANDROID_PACKAGE_NAME} \
            --skip-install
          rsync -a mobile/ LinkinKYC/

      - name: Install JavaScript dependencies
        script: |
          set -euo pipefail
          cd LinkinKYC
          npm install --no-audit --no-fund

      - name: Configure Android SDK and camera permission
        script: |
          set -euo pipefail
          cd LinkinKYC
          python3 - <<'PY'
          from pathlib import Path
          gradle = Path("android/build.gradle")
          gradle_text = gradle.read_text().replace('buildToolsVersion = "37.0.0"', 'buildToolsVersion = "36.0.0"').replace("compileSdkVersion = 37", "compileSdkVersion = 36")
          gradle.write_text(gradle_text)
          manifest = Path("android/app/src/main/AndroidManifest.xml")
          source = manifest.read_text()
          marker = '<manifest xmlns:android="http://schemas.android.com/apk/res/android">'
          if marker not in source:
              raise SystemExit("Unexpected Android manifest template")
          if "android.permission.CAMERA" not in source:
              source = source.replace(marker, marker + '\n    <uses-permission android:name="android.permission.CAMERA" />', 1)
          manifest.write_text(source)
          PY

      - name: TypeScript check
        script: |
          set -euo pipefail
          cd LinkinKYC
          npx tsc --noEmit

      - name: Build debug APK
        script: |
          set -euo pipefail
          cd LinkinKYC/android
          chmod +x ./gradlew
          ./gradlew --no-daemon assembleDebug

    artifacts:
      - LinkinKYC/android/app/build/outputs/apk/debug/app-debug.apk
      - LinkinKYC/android/app/build/reports/**
